# Volume mount specifications for Go 1.22
mounts:
  - name: "go-env"
    source: "go-env.sh"
    target: "/home/devuser/.config/go/go-env.sh"
    type: "file"
    permissions: "0644"
  - name: "component-tests"
    source: "tests/"
    target: "/home/devuser/.ai-devkit/tests/"
    type: "directory"
    permissions: "0755"