id: PYTHON_3_11
name: Python 3.11 (Official)
version: "3.11"
group: python-version
requires: []
description: Official Python 3.11 release
command_permissions:
  allow:
    - "Bash(python:*)"
    - "Bash(python3:*)"
    - "Bash(python3.11:*)"
    - "Bash(pip:*)"
    - "Bash(pip install:*)"
    - "Bash(pip freeze:*)"
    - "Bash(pytest:*)"
    - "Bash(black:*)"
    - "Bash(ruff:*)"
    - "Bash(mypy:*)"
    - "Bash(python -m:*)"
    - "Bash(textual run:*)"
    - "Bash(uvicorn:*)"
installation:
  repos:
    enabled: true
    format: "pypi"
    config_type: "both"
    config_file: "pip.conf"
    config_path: "~/.config/pip/"
    recommended:
      - name: "PyPI"
        url: "https://pypi.org"
        type: "remote"
        reason: "Official Python Package Index - required for most packages"
      - name: "PyPI Test"
        url: "https://test.pypi.org"
        type: "remote"
        reason: "Test repository for package development"
  dockerfile: |
    RUN export DEBIAN_FRONTEND=noninteractive && \
        apt-get update && \
        apt-get install -y python3.11 python3.11-venv python3-pip && \
        rm -rf /var/lib/apt/lists/* && \
        update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1 && \
        update-alternatives --set python3 /usr/bin/python3.11 && \
        ln -sf /usr/bin/python3.11 /usr/bin/python
  test_command: python --version
entrypoint_setup: |
  # Python 3.11 specific setup
  echo "Setting up Python 3.11 environment..."
  
  # Configure pip for the devuser if proxy URL is provided
  if [ -n "$PIP_INDEX_URL" ]; then
      mkdir -p /home/devuser/.config/pip
      if [ ! -f /home/devuser/.config/pip/pip.conf ]; then
          echo "[global]" > /home/devuser/.config/pip/pip.conf
          echo "index-url = ${PIP_INDEX_URL}" >> /home/devuser/.config/pip/pip.conf
          echo "trusted-host = ${PIP_TRUSTED_HOST}" >> /home/devuser/.config/pip/pip.conf
          chown -R devuser:devuser /home/devuser/.config/pip
          echo "✓ Configured pip for devuser"
      fi
  fi
