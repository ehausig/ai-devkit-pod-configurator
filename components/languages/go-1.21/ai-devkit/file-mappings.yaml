# File mapping specifications for Go 1.21
files:
  # Generated configuration file from template
  - source: generated/go-env.sh
    dest: /home/devuser/.config/go/go-env.sh
    mode: "0644"
  
  # Test files
  - source: tests/verify.sh
    dest: /home/devuser/.ai-devkit/tests/go-1-21-verify.sh
    mode: "0755"
