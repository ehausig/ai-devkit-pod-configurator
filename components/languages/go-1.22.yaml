id: GO_1_22
name: Go 1.22
version: "1.22.0"
group: go-version
requires: []
description: Go programming language version 1.22
command_permissions:
  allow:
    - "Bash(go:*)"
    - "Bash(go run:*)"
    - "Bash(go build:*)"
    - "Bash(go test:*)"
    - "Bash(go mod:*)"
    - "Bash(go get:*)"
    - "Bash(go install:*)"
    - "Bash(go fmt:*)"
    - "Bash(go vet:*)"
    - "Bash(golangci-lint:*)"
installation:
  repos:
    enabled: true
    format: "go"
    config_type: "env"
    recommended:
      - name: "Go Proxy"
        url: "https://proxy.golang.org"
        type: "remote"
        reason: "Official Go module proxy - caches and serves Go modules"
      - name: "Go Sum Database"
        url: "https://sum.golang.org"
        type: "remote"
        reason: "Official checksum database for Go modules"
  dockerfile: |
    RUN ARCH=$(dpkg --print-architecture) && \
        GO_ARCH=${ARCH} && \
        if [ "${ARCH}" = "arm64" ]; then \
            GO_ARCH="arm64"; \
        elif [ "${ARCH}" = "amd64" ]; then \
            GO_ARCH="amd64"; \
        fi && \
        wget -q https://go.dev/dl/go1.22.0.linux-${GO_ARCH}.tar.gz && \
        tar -C /usr/local -xzf go1.22.0.linux-${GO_ARCH}.tar.gz && \
        rm go1.22.0.linux-${GO_ARCH}.tar.gz && \
        echo 'export PATH=/usr/local/go/bin:$PATH' >> /etc/profile.d/go.sh
  env:
    - GOPATH=/home/claude/go
    - PATH=/usr/local/go/bin:$PATH
  test_command: go version
entrypoint_setup: |
  # Go 1.22 specific setup
  echo "Setting up Go 1.22 environment..."
  
  # Create Go workspace directory
  mkdir -p /home/devuser/go/{bin,src,pkg}
  
  # Add Go environment to bashrc
  if ! grep -q "Go environment" "$BASHRC" 2>/dev/null; then
      echo '' >> "$BASHRC"
      echo '# Go environment' >> "$BASHRC"
      echo 'export GOPATH="$HOME/go"' >> "$BASHRC"
      echo 'export PATH="/usr/local/go/bin:$GOPATH/bin:$PATH"' >> "$BASHRC"
      # Repository configuration is now handled via mounted go-env.sh
  fi
  
  # Ensure proper ownership
  chown -R devuser:devuser /home/devuser/go 2>/dev/null || true
