# Volume mount specifications for SBT
mounts:
  - name: "sbt-repositories"
    source: "repositories"
    target: "/home/devuser/.sbt/repositories"
    type: "file"
  - name: "sbt-tests"
    source: "tests/"
    target: "/home/devuser/.ai-devkit/tests/sbt/"
    type: "directory"
    permissions: "0755"