# Volume mount specifications for Maven
mounts:
  - name: "maven-settings"
    source: "settings.xml"
    target: "/home/devuser/.m2/settings.xml"
    type: "file"
  - name: "maven-tests"
    source: "tests/"
    target: "/home/devuser/.ai-devkit/tests/maven/"
    type: "directory"
    permissions: "0755"