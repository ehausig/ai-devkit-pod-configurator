# Hook definition for persona management
id: persona-manager
name: Persona Manager
description: Manages persona transitions and logs persona changes
events:
  - PreToolUse
configuration:
  matcher: "Bash"
  command: "/home/devuser/.claude/hooks/persona-manager.sh"
script: |
  #!/bin/bash
  # Persona management hook - uses hook framework
  exec /usr/local/bin/hook-framework.sh persona-manager
