# Hook definition for project lifecycle events
id: project-lifecycle
name: Project Lifecycle Tracker
description: Tracks project creation, structure decisions, and major milestones
events:
  - PostToolUse
configuration:
  matcher: "Bash"
  hook:
    type: command
    command: "/home/devuser/.claude/hooks/project-lifecycle.sh"
script: |
  #!/bin/bash
  # Project lifecycle tracking hook
  # Fixed to work with Claude Code's actual JSON structure
  
  # Read JSON input from stdin
  json_input=$(cat)
  
  # Extract command details
  command=$(echo "$json_input" | jq -r '.tool_input.command // ""')
  description=$(echo "$json_input" | jq -r '.tool_input.description // "No description"')
  
  # Check if this is PostToolUse with a response
  if echo "$json_input" | jq -e '.tool_response' > /dev/null 2>&1; then
    # Determine success from Claude Code's response structure
    interrupted=$(echo "$json_input" | jq -r '.tool_response.interrupted // false')
    stderr=$(echo "$json_input" | jq -r '.tool_response.stderr // ""')
    
    # Only log successful commands
    if [ "$interrupted" = "false" ] && [ -z "$stderr" ]; then
      # Git repository initialization
      if [[ "$command" == "git init" ]]; then
        working_dir=$(pwd)
        journal-log.sh "INFO" "Git repository initialized in $working_dir" 2>/dev/null || echo "$(date -Iseconds) [INFO] Git repository initialized in $working_dir" >> ~/workspace/JOURNAL.md
      fi
      
      # GitHub repo creation
      if [[ "$command" =~ ^gh[[:space:]]repo[[:space:]]create ]]; then
        repo_name=$(echo "$command" | grep -oE 'create[[:space:]]+[^ ]+' | awk '{print $2}')
        if [[ -n "$repo_name" ]]; then
          journal-log.sh "MILESTONE" "GitHub repo created: $repo_name" 2>/dev/null || echo "$(date -Iseconds) [MILESTONE] GitHub repo created: $repo_name" >> ~/workspace/JOURNAL.md
        fi
      fi
      
      # Branch creation/checkout
      if [[ "$command" =~ git[[:space:]]checkout[[:space:]]-b ]]; then
        branch_name=$(echo "$command" | grep -oE '\-b[[:space:]]+[^ ]+' | awk '{print $2}')
        journal-log.sh "INFO" "Created feature branch: $branch_name" 2>/dev/null || echo "$(date -Iseconds) [INFO] Created feature branch: $branch_name" >> ~/workspace/JOURNAL.md
      fi
      
      # Git commits
      if [[ "$command" =~ ^git[[:space:]]commit ]]; then
        commit_msg=$(echo "$command" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
        if [[ -n "$commit_msg" ]]; then
          journal-log.sh "MILESTONE" "Committed: $commit_msg" 2>/dev/null || echo "$(date -Iseconds) [MILESTONE] Committed: $commit_msg" >> ~/workspace/JOURNAL.md
        fi
      fi
      
      # PR creation
      if [[ "$command" =~ ^gh[[:space:]]pr[[:space:]]create ]]; then
        journal-log.sh "MILESTONE" "Pull request created" 2>/dev/null || echo "$(date -Iseconds) [MILESTONE] Pull request created" >> ~/workspace/JOURNAL.md
      fi
      
      # Project structure creation
      if [[ "$command" =~ mkdir.*-p.*(src|tests|docs) ]]; then
        journal-log.sh "INFO" "Project structure created" 2>/dev/null || echo "$(date -Iseconds) [INFO] Project structure created" >> ~/workspace/JOURNAL.md
      fi
      
      # Environment setup
      if [[ "$command" =~ (python|node|cargo|go)[[:space:]]init ]] || [[ "$command" =~ npm[[:space:]]init ]]; then
        journal-log.sh "INFO" "Development environment initialized" 2>/dev/null || echo "$(date -Iseconds) [INFO] Development environment initialized" >> ~/workspace/JOURNAL.md
      fi
      
      # Dependency installation
      if [[ "$command" =~ ^(npm|pip|cargo|go|bundle)[[:space:]]install ]]; then
        journal-log.sh "INFO" "Dependencies installed" 2>/dev/null || echo "$(date -Iseconds) [INFO] Dependencies installed" >> ~/workspace/JOURNAL.md
      fi
    fi
  fi
  
  exit 0
