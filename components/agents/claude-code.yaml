id: CLAUDE_CODE
name: Claude Code
group: ai-agents
requires: nodejs
description: AI coding assistant with autonomous development system using sub agents
pre_build_script: claude-code/claude-code-setup.sh
command_permissions:
  allow:
    - "Bash(journal-log.sh:*)"
    - "Bash(generate-card-id.sh:*)"
    - "Bash(mkdir:*)"
    - "Bash(echo:*)"
    - "Bash(ls:*)"
    - "Bash(for:*)"
    - "Bash(do:*)"
    - "Bash(done)"
    - "Bash(find:*)"
    - "Bash(git init:*)"
    - "Bash(git add:*)"
    - "Bash(git commit:*)"
    - "Bash(git tag:*)"
    - "Bash(git push:*)"
    - "Bash(export:*)"
    - "Bash(touch:*)"
    - "Bash(cat:*)"
    - "Bash(command -v:*)"
    - "Bash(time:*)"
    - "Bash(source:*)"
installation:
  dockerfile: |
    # Claude Code requires Node.js to be installed first
    # The build system should ensure nodejs-version components are installed before this
    
    # Install Claude Code globally as root first
    RUN export NPM_CONFIG_PREFIX=/home/devuser/.npm-global && \
        export PATH="/home/devuser/.npm-global/bin:/usr/local/bin:${PATH}" && \
        mkdir -p /home/devuser/.npm-global && \
        chown -R devuser:devuser /home/devuser/.npm-global && \
        npm install -g @anthropic-ai/claude-code && \
        ls -la /home/devuser/.npm-global/bin/ && \
        /home/devuser/.npm-global/bin/claude --version || (echo "Claude Code installation failed" && exit 1) && \
        chown -R devuser:devuser /home/devuser/.npm-global
  inject_files:
    - source: CLAUDE.md
      destination: /tmp/CLAUDE.md
      permissions: 644
    - source: settings.json
      destination: /tmp/settings.json
      permissions: 644
    - source: user-local-settings.json
      destination: /tmp/user-local-settings.json
      permissions: 644
    - source: commands/
      destination: /tmp/claude-commands/
      permissions: 755
    - source: agents/
      destination: /tmp/claude-agents/
      permissions: 755
    - source: hooks/
      destination: /tmp/claude-hooks/
      permissions: 755
    - source: scripts/
      destination: /tmp/claude-scripts/
      permissions: 755
    - source: docs/
      destination: /tmp/claude-docs/
      permissions: 755
    - source: component-imports.txt
      destination: /tmp/component-imports.txt
      permissions: 644
    - source: MANIFEST.txt
      destination: /tmp/MANIFEST.txt
      permissions: 644
entrypoint_setup: |
  echo "Setting up Claude Code autonomous development environment..."
  
  mkdir -p /home/devuser/.claude
  mkdir -p /home/devuser/.claude/agents
  mkdir -p /home/devuser/.claude/commands
  mkdir -p /home/devuser/.claude/docs
  mkdir -p /home/devuser/.claude/hooks
  mkdir -p /home/devuser/.claude/scripts
  mkdir -p /home/devuser/workspace/.claude

  cp /tmp/CLAUDE.md /home/devuser/.claude/CLAUDE.md
  
  if [ -f /tmp/component-imports.txt ]; then
      cat /tmp/component-imports.txt >> /home/devuser/.claude/CLAUDE.md
  fi
 
  # Copy component documentation files
  if [ -d /tmp/claude-docs ]; then
      for md_file in /tmp/claude-docs/*.md; do
          if [ -f "$md_file" ]; then
              basename_file=$(basename "$md_file")
              cp "$md_file" "/home/devuser/.claude/docs/$basename_file"
          fi
      done
  fi
  
  if [ -d /tmp/claude-scripts ]; then
      cp /tmp/claude-scripts/*.sh /home/devuser/.claude/scripts/
      chmod +x /home/devuser/.claude/scripts/*.sh

      for sh_file in /home/devuser/.claude/scripts/*.sh; do
          if [ -f "$sh_file" ]; then
              basename_file=$(basename "$sh_file")
              ln -sf "$sh_file" "/usr/local/bin/$basename_file" 2>/dev/null || true
          fi
      done
  fi
  
  cp /tmp/settings.json /home/devuser/.claude/settings.json
  cp /tmp/user-local-settings.json /home/devuser/workspace/.claude/user-local-settings.json
 
  if [ -d /tmp/claude-commands ] && [ "$(ls -A /tmp/claude-commands/*.md 2>/dev/null)" ]; then
      cp /tmp/claude-commands/*.md /home/devuser/.claude/commands/
  fi
  
  # Copy agents
  if [ -d /tmp/claude-agents ] && [ "$(ls -A /tmp/claude-agents/*.md 2>/dev/null)" ]; then
      cp /tmp/claude-agents/*.md /home/devuser/.claude/agents/
  fi
  
  if [ -d /tmp/claude-hooks ] && [ "$(ls -A /tmp/claude-hooks/*.sh 2>/dev/null)" ]; then
      cp /tmp/claude-hooks/*.sh /home/devuser/.claude/hooks/
      chmod +x /home/devuser/.claude/hooks/*.sh
  fi
