id: CLAUDE_CODE
name: Claude Code (Autonomous Development)
group: ai-agents
requires: []
description: AI coding assistant with autonomous event-driven development system
pre_build_script: claude-code/claude-code-setup.sh
installation:
  dockerfile: |
    # Claude Code requires Node.js to be installed first
    # The build system should ensure nodejs-version components are installed before this
    
    # Install Claude Code globally as root first
    RUN export NPM_CONFIG_PREFIX=/home/devuser/.npm-global && \
        export PATH="/home/devuser/.npm-global/bin:/usr/local/bin:${PATH}" && \
        mkdir -p /home/devuser/.npm-global && \
        chown -R devuser:devuser /home/devuser/.npm-global && \
        /usr/local/bin/npm install -g @anthropic-ai/claude-code && \
        ls -la /home/devuser/.npm-global/bin/ && \
        /home/devuser/.npm-global/bin/claude --version || (echo "Claude Code installation failed" && exit 1) && \
        chown -R devuser:devuser /home/devuser/.npm-global
  inject_files:
    - source: user-CLAUDE.md
      destination: /tmp/user-CLAUDE.md
      permissions: 644
    - source: claude-settings.json.template
      destination: /tmp/claude-settings.json.template
      permissions: 644
    - source: commands/
      destination: /tmp/claude-commands/
      permissions: 755
    - source: hooks/
      destination: /tmp/claude-hooks/
      permissions: 755
    - source: personas/
      destination: /tmp/claude-personas/
      permissions: 755
    - source: component-imports.txt
      destination: /tmp/component-imports.txt
      permissions: 644
    - source: MANIFEST.txt
      destination: /tmp/MANIFEST.txt
      permissions: 644
entrypoint_setup: |
  # Claude Code specific setup
  echo "Setting up Claude Code autonomous development environment..."
  
  # Create .claude directory for global Claude configuration
  if command -v claude &> /dev/null 2>&1 || [ -f /tmp/user-CLAUDE.md ]; then
      mkdir -p /home/devuser/.claude
      mkdir -p /home/devuser/.claude/hooks
      mkdir -p /home/devuser/.claude/commands
      mkdir -p /home/devuser/.claude/personas
  fi
  
  # Copy settings.json from template
  if [ -f /tmp/claude-settings.json.template ]; then
      if [ ! -f /home/devuser/.claude/settings.json ]; then
          echo "Installing Claude Code settings..."
          cp /tmp/claude-settings.json.template /home/devuser/.claude/settings.json
          echo "✓ Settings installed with orchestration hook"
      fi
  fi
  
  # Install orchestration hook
  if [ -f /tmp/claude-hooks/orchestrate.sh ]; then
      echo "Installing orchestration hook..."
      cp /tmp/claude-hooks/orchestrate.sh /home/devuser/.claude/hooks/
      chmod +x /home/devuser/.claude/hooks/orchestrate.sh
      echo "✓ Orchestration hook installed"
  fi
  
  # Install commands
  if [ -d /tmp/claude-commands ] && [ "$(ls -A /tmp/claude-commands/*.md 2>/dev/null)" ]; then
      echo "Installing autonomous development commands..."
      cp /tmp/claude-commands/*.md /home/devuser/.claude/commands/
      
      # List installed commands
      echo "Installed commands:"
      for cmd in /home/devuser/.claude/commands/*.md; do
          echo "  - /$(basename "$cmd" .md)"
      done
      echo "✓ Commands installed successfully"
  fi
  
  # Install persona protocols
  if [ -d /tmp/claude-personas ] && [ "$(ls -A /tmp/claude-personas/*.md 2>/dev/null)" ]; then
      echo "Installing persona protocols..."
      cp /tmp/claude-personas/*.md /home/devuser/.claude/personas/
      
      # List installed personas
      echo "Installed personas:"
      for protocol in /home/devuser/.claude/personas/*-PROTOCOL.md; do
          if [ -f "$protocol" ]; then
              persona=$(basename "$protocol" -PROTOCOL.md)
              echo "  - $persona"
          fi
      done
      echo "✓ Persona protocols installed"
  fi
  
  # Append component imports to user documentation
  if [ -f /tmp/component-imports.txt ] && [ -f /tmp/user-CLAUDE.md ]; then
      echo "Appending component information..."
      cat /tmp/user-CLAUDE.md > /home/devuser/.claude/user-CLAUDE.md
      cat /tmp/component-imports.txt >> /home/devuser/.claude/user-CLAUDE.md
      echo "✓ User documentation updated with components"
  fi
  
  # Create workspace directory for journal
  mkdir -p /home/devuser/workspace
  chown devuser:devuser /home/devuser/workspace
  
  # Ensure proper ownership
  chown -R devuser:devuser /home/devuser/.claude
  
  # Display setup summary
  echo ""
  echo "═══════════════════════════════════════════════════════════"
  echo "Claude Code Autonomous Development System Ready!"
  echo "═══════════════════════════════════════════════════════════"
  echo ""
  echo "Quick Start:"
  echo "1. Start Claude Code: 'claude'"
  echo "2. Describe your project"
  echo "3. Use: /init-project"
  echo "4. The system will autonomously develop your application"
  echo ""
  echo "Available Commands:"
  echo "  /init-project    - Start a new project"
  echo "  /show-journal    - View development progress"
  echo "  /persona-status  - Check persona states"
  echo "  /event-query     - Query specific events"
  echo ""
  echo "The system will automatically hand off work between:"
  echo "ARCHITECT → DEVELOPER → QA → REVIEWER → MERGER"
  echo "═══════════════════════════════════════════════════════════"
  
  # Verify Claude Code is available
  if command -v claude &> /dev/null 2>&1; then
      echo ""
      echo "Claude Code is available at: $(which claude)"
  fi
