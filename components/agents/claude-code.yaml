id: CLAUDE_CODE
name: Claude Code (Autonomous Development)
group: ai-agents
requires: []
description: AI coding assistant with autonomous development system using sub agents
pre_build_script: claude-code/claude-code-setup.sh
command_permissions:
  allow:
    - "Bash(journal-log.sh:*)"
    - "Bash(mkdir:*)"
    - "Bash(echo:*)"
    - "Bash(ls:*)"
    - "Bash(for:* i in {1..10})"
    - "Bash(do time:*)"
    - "Bash(done)"
    - "Bash(find:*)"
    - "Bash(git init:*)"
    - "Bash(git add:*)"
    - "Bash(git commit:*)"
    - "Bash(git tag:*)"
    - "Bash(git push:*)"
installation:
  dockerfile: |
    # Claude Code requires Node.js to be installed first
    # The build system should ensure nodejs-version components are installed before this
    
    # Install Claude Code globally as root first
    RUN export NPM_CONFIG_PREFIX=/home/devuser/.npm-global && \
        export PATH="/home/devuser/.npm-global/bin:/usr/local/bin:${PATH}" && \
        mkdir -p /home/devuser/.npm-global && \
        chown -R devuser:devuser /home/devuser/.npm-global && \
        /usr/local/bin/npm install -g @anthropic-ai/claude-code && \
        ls -la /home/devuser/.npm-global/bin/ && \
        /home/devuser/.npm-global/bin/claude --version || (echo "Claude Code installation failed" && exit 1) && \
        chown -R devuser:devuser /home/devuser/.npm-global
  inject_files:
    - source: user-CLAUDE.md
      destination: /tmp/user-CLAUDE.md
      permissions: 644
    - source: claude-settings.json.template
      destination: /tmp/claude-settings.json.template
      permissions: 644
    - source: claude-workspace-settings.json
      destination: /tmp/claude-workspace-settings.json
      permissions: 644
    - source: commands/
      destination: /tmp/claude-commands/
      permissions: 755
    - source: hooks/
      destination: /tmp/claude-hooks/
      permissions: 755
    - source: agents/
      destination: /tmp/claude-agents/
      permissions: 755
    - source: scripts/
      destination: /tmp/claude-scripts/
      permissions: 755
    - source: component-imports.txt
      destination: /tmp/component-imports.txt
      permissions: 644
    - source: MANIFEST.txt
      destination: /tmp/MANIFEST.txt
      permissions: 644
entrypoint_setup: |
  # Claude Code specific setup
  echo "Setting up Claude Code autonomous development environment..."
  
  # Create .claude directory for global Claude configuration
  if command -v claude &> /dev/null 2>&1 || [ -f /tmp/user-CLAUDE.md ]; then
      mkdir -p /home/devuser/.claude
      mkdir -p /home/devuser/.claude/hooks
      mkdir -p /home/devuser/.claude/commands
      mkdir -p /home/devuser/.claude/agents
  fi
  
  # Install journal logging script
  if [ -f /tmp/claude-scripts/journal-log.sh ]; then
      echo "Installing journal logging utility..."
      mkdir -p /home/devuser/bin
      cp /tmp/claude-scripts/journal-log.sh /home/devuser/bin/journal-log.sh
      chmod +x /home/devuser/bin/journal-log.sh
      # Add to PATH if not already there
      if ! echo "$PATH" | grep -q "/home/devuser/bin"; then
          echo 'export PATH="/home/devuser/bin:$PATH"' >> /home/devuser/.bashrc
          echo 'export PATH="/home/devuser/bin:$PATH"' >> /home/devuser/.profile
      fi
      # Also make it available system-wide
      ln -sf /home/devuser/bin/journal-log.sh /usr/local/bin/journal-log.sh 2>/dev/null || true
      echo "✓ Journal logging utility installed"
  else
      echo "⚠️ Journal logging script not found in /tmp/claude-scripts/"
  fi
  
  # Copy settings.json from template
  if [ -f /tmp/claude-settings.json.template ]; then
      echo "Installing Claude Code settings..."
      cp /tmp/claude-settings.json.template /home/devuser/.claude/settings.json
      echo "✓ Settings installed with autonomous stop hook"
  else
      echo "⚠️ Settings template not found in /tmp/"
  fi
  
  # Copy workspace settings to workspace directory
  if [ -f /tmp/claude-workspace-settings.json ]; then
      echo "Installing workspace-specific Claude Code settings..."
      mkdir -p /home/devuser/workspace/.claude
      cp /tmp/claude-workspace-settings.json /home/devuser/workspace/.claude/settings.local.json
      chown -R devuser:devuser /home/devuser/workspace/.claude
      echo "✓ Workspace settings installed with component permissions"
  else
      echo "⚠️ Workspace settings not found in /tmp/"
  fi
  
  # Install autonomous continuation hook
  if [ -f /tmp/claude-hooks/autonomous-continue.sh ]; then
      echo "Installing autonomous continuation hook..."
      cp /tmp/claude-hooks/autonomous-continue.sh /home/devuser/.claude/hooks/
      chmod +x /home/devuser/.claude/hooks/autonomous-continue.sh
      echo "✓ Autonomous continuation hook installed"
  fi
  
  # Install commands
  if [ -d /tmp/claude-commands ] && [ "$(ls -A /tmp/claude-commands/*.md 2>/dev/null)" ]; then
      echo "Installing autonomous development commands..."
      cp /tmp/claude-commands/*.md /home/devuser/.claude/commands/
      
      # List installed commands
      echo "Installed commands:"
      for cmd in /home/devuser/.claude/commands/*.md; do
          echo "  - /$(basename "$cmd" .md)"
      done
      echo "✓ Commands installed successfully"
  fi
  
  # Install sub agents
  if [ -d /tmp/claude-agents ] && [ "$(ls -A /tmp/claude-agents/*.md 2>/dev/null)" ]; then
      echo "Installing autonomous development agents..."
      cp /tmp/claude-agents/*.md /home/devuser/.claude/agents/
      
      # List installed agents
      echo "Installed agents:"
      for agent in /home/devuser/.claude/agents/*.md; do
          agent_name=$(basename "$agent" .md)
          echo "  - $agent_name"
      done
      echo "✓ Sub agents installed successfully"
  fi
  
  # Append component imports to user documentation
  if [ -f /tmp/component-imports.txt ] && [ -f /tmp/user-CLAUDE.md ]; then
      echo "Appending component information..."
      cat /tmp/user-CLAUDE.md > /home/devuser/.claude/user-CLAUDE.md
      cat /tmp/component-imports.txt >> /home/devuser/.claude/user-CLAUDE.md
      echo "✓ User documentation updated with components"
  fi
  
  # Create workspace directory for journal
  mkdir -p /home/devuser/workspace
  chown devuser:devuser /home/devuser/workspace
  
  # Ensure proper ownership
  chown -R devuser:devuser /home/devuser/.claude
  
  # Display setup summary
  echo ""
  echo "═══════════════════════════════════════════════════════════"
  echo "Claude Code Autonomous Development System Ready!"
  echo "═══════════════════════════════════════════════════════════"
  echo ""
  echo "Quick Start:"
  echo "1. Start Claude Code: 'claude'"
  echo "2. Describe your project"
  echo "3. Use: /init-autonomous"
  echo "4. The system will autonomously develop your application"
  echo ""
  echo "Available Commands:"
  echo "  /init-autonomous - Start a new autonomous project"
  echo "  /show-journal    - View development progress"
  echo "  /event-query     - Query specific events"
  echo ""
  echo "The system will automatically progress through:"
  echo "PRODUCT_MANAGER → ARCHITECT → DEVELOPER → QA → REVIEWER → MERGER"
  echo "═══════════════════════════════════════════════════════════"
  
  # Verify Claude Code is available
  if command -v claude &> /dev/null 2>&1; then
      echo ""
      echo "Claude Code is available at: $(which claude)"
  fi
