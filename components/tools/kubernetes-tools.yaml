id: KUBERNETES_TOOLS
name: Kubernetes Tools
version: "1.34.1"
group: kubernetes-cli
requires: []
description: Kubernetes CLI tools - kubectl, helm, k9s, kubectx/kubens, stern
command_permissions:
  allow:
    - "Bash(kubectl:*)"
    - "Bash(helm:*)"
    - "Bash(k9s:*)"
    - "Bash(kubectx:*)"
    - "Bash(kubens:*)"
    - "Bash(stern:*)"
    - "Bash(configure-kubeconfig.sh:*)"
    - "Read(/home/devuser/.kube/*)"
    - "Write(/home/devuser/.kube/*)"
    - "Edit(/home/devuser/.kube/*)"
  deny: []
installation:
  dockerfile: |
    # Install Kubernetes CLI tools with explicit versions
    RUN export DEBIAN_FRONTEND=noninteractive && \
        ARCH=$(dpkg --print-architecture) && \
        # Determine architecture for downloads
        if [ "${ARCH}" = "arm64" ]; then \
            KUBECTL_ARCH="arm64"; \
            HELM_ARCH="arm64"; \
            K9S_ARCH="arm64"; \
            STERN_ARCH="arm64"; \
            KUBECTX_ARCH="arm64"; \
        elif [ "${ARCH}" = "amd64" ]; then \
            KUBECTL_ARCH="amd64"; \
            HELM_ARCH="amd64"; \
            K9S_ARCH="amd64"; \
            STERN_ARCH="amd64"; \
            KUBECTX_ARCH="x86_64"; \
        else \
            echo "Unsupported architecture: ${ARCH}" && exit 1; \
        fi && \
        # Install kubectl v1.34.1
        curl -LO "https://dl.k8s.io/release/v1.34.1/bin/linux/${KUBECTL_ARCH}/kubectl" && \
        chmod +x kubectl && \
        mv kubectl /usr/local/bin/kubectl && \
        # Install helm v3.19.0
        wget -q "https://get.helm.sh/helm-v3.19.0-linux-${HELM_ARCH}.tar.gz" && \
        tar -zxf helm-v3.19.0-linux-${HELM_ARCH}.tar.gz && \
        mv linux-${HELM_ARCH}/helm /usr/local/bin/helm && \
        rm -rf helm-v3.19.0-linux-${HELM_ARCH}.tar.gz linux-${HELM_ARCH} && \
        # Install k9s v0.50.16
        wget -q "https://github.com/derailed/k9s/releases/download/v0.50.16/k9s_linux_${KUBECTL_ARCH}.tar.gz" && \
        tar -zxf k9s_linux_${KUBECTL_ARCH}.tar.gz && \
        mv k9s /usr/local/bin/k9s && \
        rm k9s_linux_${KUBECTL_ARCH}.tar.gz && \
        # Install kubectx and kubens v0.9.5
        wget -q "https://github.com/ahmetb/kubectx/releases/download/v0.9.5/kubectx_v0.9.5_linux_${KUBECTX_ARCH}.tar.gz" && \
        tar -zxf kubectx_v0.9.5_linux_${KUBECTX_ARCH}.tar.gz && \
        mv kubectx /usr/local/bin/kubectx && \
        rm kubectx_v0.9.5_linux_${KUBECTX_ARCH}.tar.gz && \
        wget -q "https://github.com/ahmetb/kubectx/releases/download/v0.9.5/kubens_v0.9.5_linux_${KUBECTX_ARCH}.tar.gz" && \
        tar -zxf kubens_v0.9.5_linux_${KUBECTX_ARCH}.tar.gz && \
        mv kubens /usr/local/bin/kubens && \
        rm kubens_v0.9.5_linux_${KUBECTX_ARCH}.tar.gz && \
        # Install stern v1.33.1
        wget -q "https://github.com/stern/stern/releases/download/v1.33.1/stern_1.33.1_linux_${KUBECTL_ARCH}.tar.gz" && \
        tar -zxf stern_1.33.1_linux_${KUBECTL_ARCH}.tar.gz && \
        mv stern /usr/local/bin/stern && \
        rm stern_1.33.1_linux_${KUBECTL_ARCH}.tar.gz && \
        # Verify installations
        kubectl version --client && \
        helm version && \
        k9s version && \
        kubectx --version && \
        kubens --version && \
        stern --version
  test_command: kubectl version --client && helm version && k9s version && stern --version
  inject_files:
    - source: configure-kubeconfig.sh
      destination: /usr/local/bin/configure-kubeconfig.sh
      permissions: "755"
entrypoint_setup: |
  # Kubernetes tools specific setup
  echo "Setting up Kubernetes tools environment..."

  # Create .kube directory for kubectl configuration
  mkdir -p /home/devuser/.kube

  # Set proper ownership
  chown -R devuser:devuser /home/devuser/.kube

  # Create welcome message with setup instructions
  cat > /home/devuser/.kubernetes-tools-readme.txt << 'READMEEOF'
  ================================================================================
                       Kubernetes Tools Installed
  ================================================================================

  The following Kubernetes tools are now available:

    - kubectl (v1.34.1)   - Kubernetes command-line tool
    - helm (v3.19.0)      - Kubernetes package manager
    - k9s (v0.50.16)      - Kubernetes TUI
    - kubectx (v0.9.5)    - Switch between Kubernetes contexts
    - kubens (v0.9.5)     - Switch between Kubernetes namespaces
    - stern (v1.33.1)     - Multi-pod log tailing

  ================================================================================
                       Kubeconfig Setup Required
  ================================================================================

  To connect to your Kubernetes cluster, run:

      configure-kubeconfig.sh

  This interactive script will help you set up your ~/.kube/config file by:
    1. Detecting K3s on your host machine (if available)
    2. Configuring access to remote Kubernetes clusters
    3. Setting up multiple contexts for cluster management

  Quick Start:
    - View this help:    configure-kubeconfig.sh --help
    - List contexts:     kubectl config get-contexts
    - Switch context:    kubectx <context-name>
    - Switch namespace:  kubens <namespace-name>
    - Kubernetes TUI:    k9s

  READMEEOF

  chown devuser:devuser /home/devuser/.kubernetes-tools-readme.txt

  echo "✓ Kubernetes tools configured successfully"
  echo "  Run 'configure-kubeconfig.sh' to set up cluster access"
