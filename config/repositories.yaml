# Default repository configurations for all package managers
# These can be overridden with a custom repositories.yaml file

pypi:
  repositories:
    - name: "pypi"
      url: "https://pypi.org/simple"
      
npm:
  repositories:
    - name: "npm"
      url: "https://registry.npmjs.org/"
      
maven2:
  repositories:
    - name: "maven-central"
      url: "https://repo.maven.apache.org/maven2"
      
cargo:
  repositories:
    - name: "crates-io"
      url: "https://github.com/rust-lang/crates.io-index"
      
go:
  repositories:
    - name: "goproxy"
      url: "https://proxy.golang.org"
      
gradle:
  repositories:
    - name: "gradle-central"
      url: "https://repo.maven.apache.org/maven2"
    - name: "gradle-google"
      url: "https://maven.google.com"
      
sbt:
  repositories:
    - name: "sbt-central"
      url: "https://repo1.maven.org/maven2/"